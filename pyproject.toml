[tool.black]
line-length = 120
target-version = ["py33"]

[tool.pyright]
pythonVersion = "3.8"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint.isort]
case-sensitive = false
force-single-line = true
from-first = true
order-by-type = false
required-imports = ["from __future__ import annotations"]
